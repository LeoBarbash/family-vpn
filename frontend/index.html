<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family VPN</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Self-hosted</p>
          <h1>Family VPN</h1>
        </div>
        <div id="status-pill" class="pill pill-off">Disconnected</div>
      </header>

      <section class="card">
        <label for="profile-name">Profile name</label>
        <input id="profile-name" type="text" value="family" />

        <label for="config">AmneziaWG config (wg-quick format)</label>
        <textarea id="config" rows="16" spellcheck="false"></textarea>

        <div class="actions">
          <button id="load-example" class="ghost">Load example</button>
          <button id="connect" class="primary">Connect</button>
          <button id="disconnect" class="danger" disabled>Disconnect</button>
        </div>
        <p id="message" class="message"></p>
      </section>

      <section class="card meta">
        <h2>Status</h2>
        <dl>
          <div><dt>Endpoint</dt><dd id="endpoint">—</dd></div>
          <div><dt>Interface</dt><dd id="interface">—</dd></div>
          <div><dt>Since</dt><dd id="since">—</dd></div>
        </dl>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
